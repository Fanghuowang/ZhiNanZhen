<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>东南西北 · 罗盘</title>
  <style>
    :root {
      --bg: #000000;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --dial-bg: #1c1c1e;
      --north-color: #ff3b30;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .compass-container {
      position: relative;
      width: min(85vw, 85vh, 380px);
      height: min(85vw, 85vh, 380px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .dial-wrapper {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      will-change: transform;
    }

    .dial-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--dial-bg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .ticks-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: visible;
    }

    /* Cardinal Characters */
    .cardinal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      transform-origin: 0 145px;
    }
    
    .cardinal.n { transform: rotate(0deg); color: var(--north-color); }
    .cardinal.e { transform: rotate(90deg); color: var(--text-primary); }
    .cardinal.s { transform: rotate(180deg); color: var(--text-primary); }
    .cardinal.w { transform: rotate(270deg); color: var(--text-primary); }

    .cardinal span {
      display: block;
      transform: rotate(calc(-1 * var(--angle)));
    }

    /* Center Needle */
    .needle-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 100px;
      margin-left: -2px;
      margin-top: -100px;
      background: linear-gradient(to top, transparent 0%, var(--north-color) 100%);
      border-radius: 4px 4px 0 0;
      transform-origin: bottom center;
      z-index: 10;
    }

    .needle-tail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 70px;
      margin-left: -2px;
      background: linear-gradient(to bottom, transparent 0%, #5c5c5e 100%);
      border-radius: 0 0 4px 4px;
      transform-origin: top center;
      z-index: 10;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 20;
    }

    /* Bottom Info */
    .info-panel {
      text-align: center;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
    }

    .heading-text {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .direction-text {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .permission-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 40px;
      text-align: center;
      transition: opacity 0.3s;
    }
    
    .permission-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .btn-primary {
      background: #0a84ff;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="permission-overlay" id="permOverlay">
    <h2>Compass Access</h2>
    <p>This app requires access to your device's compass to provide accurate headings.</p>
    <button class="btn-primary" id="grantBtn">Enable Sensors</button>
  </div>

  <div class="compass-container">
    <div class="dial-wrapper" id="dialWrapper">
      <div class="dial-bg"></div>
      <svg class="ticks-svg" viewBox="0 0 200 200" id="ticksSvg"></svg>
      
      <div class="cardinal n"><span style="--angle: 0deg">北</span></div>
      <div class="cardinal e"><span style="--angle: 90deg">东</span></div>
      <div class="cardinal s"><span style="--angle: 180deg">南</span></div>
      <div class="cardinal w"><span style="--angle: 270deg">西</span></div>
    </div>

    <div class="needle-container" id="needleContainer">
      <div class="needle"></div>
      <div class="needle-tail"></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <div class="info-panel">
    <div class="heading-text" id="headingText">0°</div>
    <div class="direction-text" id="directionText">北</div>
    
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Altitude</span>
        <span class="meta-value" id="altValue">-- m</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Speed</span>
        <span class="meta-value" id="speedValue">0 km/h</span>
      </div>
    </div>
  </div>

  <script>
    const dialWrapper = document.getElementById('dialWrapper');
    const needleContainer = document.getElementById('needleContainer');
    const headingText = document.getElementById('headingText');
    const directionText = document.getElementById('directionText');
    const permOverlay = document.getElementById('permOverlay');
    const grantBtn = document.getElementById('grantBtn');
    const ticksSvg = document.getElementById('ticksSvg');

    let currentHeading = 0;
    let targetHeading = 0;
    let isTracking = false;

    // 1. Generate SVG Ticks & Numbers
    function generateTicks() {
      let html = '';
      for (let i = 0; i < 360; i += 2) {
        const isMajor = i % 30 === 0;
        const isMedium = i % 10 === 0;
        
        const angle = (i - 90) * (Math.PI / 180);
        const outerRadius = 90;
        const innerRadius = isMajor ? 80 : (isMedium ? 85 : 88);
        
        const x1 = 100 + outerRadius * Math.cos(angle);
        const y1 = 100 + outerRadius * Math.sin(angle);
        const x2 = 100 + innerRadius * Math.cos(angle);
        const y2 = 100 + innerRadius * Math.sin(angle);
        
        const strokeWidth = isMajor ? 2 : (isMedium ? 1.5 : 0.8);
        const strokeColor = isMajor ? '#ffffff' : (isMedium ? '#a0a0a5' : '#5c5c5e');
        
        html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
      }
      
      // Add numbers cleanly on the inner ring
      [30, 60, 120, 150, 210, 240, 300, 330].forEach(deg => {
        const rad = (deg - 90) * (Math.PI / 180);
        const x = 100 + 70 * Math.cos(rad);
        const y = 100 + 70 * Math.sin(rad);
        
        html += `
          <text x="${x}" y="${y}" fill="#8e8e93" font-size="7" font-weight="500" text-anchor="middle" dominant-baseline="middle" 
                transform="rotate(${deg} ${x} ${y})">
            ${deg}°
          </text>
        `;
      });

      ticksSvg.innerHTML = html;
    }

    const dirNames = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];

    // 2. Smooth Animation Loop
    let lastRenderTime = performance.now();
    function render(now) {
      const dt = now - lastRenderTime;
      lastRenderTime = now;

      if (isTracking) {
        let diff = targetHeading - currentHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        
        // Smooth lerp
        currentHeading += diff * 0.12;
        currentHeading = (currentHeading + 360) % 360;
        
        // Dial rotates WITH heading, Needle rotates OPPOSITE to stay pointing North
        dialWrapper.style.transform = `rotate(${-currentHeading}deg)`;
        needleContainer.style.transform = `rotate(${currentHeading}deg)`;

        const displayDeg = Math.round(currentHeading);
        headingText.textContent = `${displayDeg}°`;
        
        const dirIdx = Math.round(displayDeg / 45) % 8;
        directionText.textContent = dirNames[dirIdx];
        
        if (dirIdx === 0) {
          directionText.style.color = 'var(--north-color)';
        } else {
          directionText.style.color = 'var(--text-secondary)';
        }
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // 3. Sensor Logic (DIRECTLY ported from your reference file)
    function manageCompass(e) {
      let absoluteHeading = 0;
      
      // This is the exact math from your source file
      if (e.webkitCompassHeading) {
        absoluteHeading = e.webkitCompassHeading - 180;
      } else if (e.alpha !== null && e.alpha !== undefined) {
        absoluteHeading = 180 + e.alpha;
      } else {
        return;
      }

      absoluteHeading -= 180;
      if (absoluteHeading > 360) absoluteHeading -= 360;
      if (absoluteHeading < 0) absoluteHeading += 360;

      targetHeading = absoluteHeading;

      if (!isTracking) {
        isTracking = true;
        currentHeading = targetHeading;
        permOverlay.classList.add('hidden');
      }
    }

    // 4. Initialization & Permissions
    function initSensors() {
      // Use the exact event listeners and platform detection from your source
      const isiOS = ["iPad Simulator","iPhone Simulator","iPod Simulator","iPad","iPhone","iPod"].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
      
      if (isiOS) {
        window.addEventListener("deviceorientation", manageCompass);
      } else {
        // Android
        window.addEventListener("deviceorientationabsolute", manageCompass, true);
        // Fallback
        window.addEventListener("deviceorientation", manageCompass, true);
      }
    }

    grantBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              initSensors();
              permOverlay.classList.add('hidden');
            }
          })
          .catch(console.error);
      } else {
        initSensors();
        permOverlay.classList.add('hidden');
      }
    });

    // Auto-start for Android
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      initSensors();
      permOverlay.classList.add('hidden');
    }

    generateTicks();
  </script>
</body>
</html>
