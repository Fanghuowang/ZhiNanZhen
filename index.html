<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线指南针 - 免费实时指南针，快速找到正北方向</title>
    <style>
        @font-face {
            font-family: "icomoon";
            src: url("https://onlinecompass.net/fonts/icons/icomoon.woff") format("woff");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        [class^="icon-"], [class*=" icon-"] {
            font-family: "icomoon" !important;
            speak: never;
            font-style: normal;
            font-weight: 400;
            font-variant: normal;
            text-transform: none;
            line-height: 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .icon-compass:before { content: "\e910"; }
        
        :root {
            --bg-color: #fff;
            --main-color: #5498e5;
            --text-color: #5a5a5a;
            --text-blue: #1f5fb4;
            --accent-color: #f8c74b;
            --info-color: #dc3545;
        }
        *, *::before, *::after {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            outline: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        html, body {
            overflow-x: hidden !important;
            width: 100% !important;
            max-width: 100% !important;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 2;
            color: var(--text-color);
            min-height: 100vh;
            background: var(--bg-color);
        }
        a {
            color: inherit !important;
            text-decoration: none;
            cursor: pointer;
        }
        ul {
            list-style: none;
        }
        nav {
            width: 100%;
            height: 60px;
            background-color: #2c6cb0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        nav .holder {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        nav .logo i {
            font-size: 2rem;
        }
        .holder {
            margin: 0 auto;
            max-width: 1124px;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 指南针核心样式 */
        .compass {
            position: relative;
            height: auto;
            aspect-ratio: 1/1;
            width: 80%;
            max-width: 380px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.15);
            margin: 40px auto;
            background: #fdfdfd;
            border: 4px solid #eef1f5;
        }

        /* 顶部固定黄色指示箭头 */
        .compass .arrow {
            position: absolute;
            width: 0;
            height: 0;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            border-style: solid;
            border-width: 32px 20px 0 20px;
            border-color: var(--accent-color) transparent transparent transparent;
            z-index: 10;
        }

        /* 旋转的表盘 */
        .compass > .compass-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            transition: none !important;
            /* 这里生成一个基础的带东南西北和刻度线的表盘背景 */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="%23e0e0e0" stroke-width="0.5"/><text x="50" y="15" font-size="7" font-weight="bold" fill="%23dc3545" text-anchor="middle">北</text><text x="50" y="92" font-size="7" font-weight="bold" fill="%235a5a5a" text-anchor="middle">南</text><text x="15" y="53" font-size="7" font-weight="bold" fill="%235a5a5a" text-anchor="middle">西</text><text x="85" y="53" font-size="7" font-weight="bold" fill="%235a5a5a" text-anchor="middle">东</text>');
        }

        /* 中心固定圆点 */
        .compass::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border: 2px solid var(--main-color);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        /* 实时角度显示大卡片 */
        .direction-readings {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: -10px auto 30px;
        }
        .reading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(100%, 420px);
            padding: 16px 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-radius: 16px;
            background: #fff;
            border: 1px solid #eef1f5;
        }
        .reading-chip {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .reading-chip.magnetic {
            background: var(--accent-color);
        }
        .reading-label {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            flex: 1;
        }
        .reading-value {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--main-color);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body style="direction: ltr">

    <nav>
        <div class="holder">
            <div class="logo">
                <a href="#"><i class="icon-compass" aria-hidden="true"></i></a>
            </div>
        </div>
    </nav>

    <div class="holder">
        <div class="compass" id="compass">
            <!-- 顶部固定指针 -->
            <div class="arrow"></div>
            <!-- 旋转的表盘 -->
            <div class="compass-circle" id="compassCircle"></div>
        </div>

        <div class="direction-readings">
            <div class="reading">
                <div style="display:flex; align-items:center;">
                    <span class="reading-chip magnetic" aria-hidden="true"></span>
                    <span class="reading-label">当前方向</span>
                </div>
                <span class="reading-value" id="magneticValue">0.0°</span>
            </div>
        </div>
    </div>

    <script>
        const compassCircle = document.getElementById("compassCircle");
        const magneticValue = document.getElementById("magneticValue");
        
        let pendingFrame = false;
        let latestCompass = 0;
        let hasHeading = false;
        let fallbackTimer = null;

        // 更新UI及表盘旋转
        function onCompassFrame() {
            if (!hasHeading) return;
            
            // 修复箭头位置：表盘实际是根据设备旋转反向旋转的
            // 因为表盘上的“北”标记会随表盘转动，而手机顶端固定指着屏幕上方
            compassCircle.style.transform = `translate(-50%, -50%) rotate(${-latestCompass}deg)`;
            
            // 更新角度文字显示
            magneticValue.textContent = `${latestCompass.toFixed(1)}°`;
        }

        function applyHeading(heading) {
            // 平滑处理角度，防止在 0 和 360 之间跳跃
            latestCompass = heading;
            hasHeading = true;
            
            if (pendingFrame) return;
            pendingFrame = true;
            requestAnimationFrame(function () {
                pendingFrame = false;
                onCompassFrame();
            });
        }

        // 绝对方向传感器 (Android Chrome / Edge)
        function handlerAbsolute(e) {
            if (typeof e.alpha !== "number") return;
            
            if (fallbackTimer !== null) {
                clearTimeout(fallbackTimer);
                fallbackTimer = null;
            }
            window.removeEventListener("deviceorientation", handlerFallback, true);
            
            // e.alpha 从 0 到 360 顺时针旋转（0表示北，90表示东）。
            // 我们需要计算手机顶端指向的绝对角度
            applyHeading(Math.abs(e.alpha - 360));
        }

        // 备用传感器 (iOS / 部分旧版 Android)
        function handlerFallback(e) {
            if (typeof e.webkitCompassHeading === "number") {
                applyHeading(e.webkitCompassHeading);
                return;
            }
            if (typeof e.alpha !== "number") return;
            applyHeading(Math.abs(e.alpha - 360));
        }

        function registerFallback() {
            fallbackTimer = null;
            window.addEventListener("deviceorientation", handlerFallback, true);
        }

        // 自动启动逻辑 (专为 Android 优化)
        function initCompass() {
            // Android 浏览器通常支持 deviceorientationabsolute，且不需要用户点击授权
            window.addEventListener("deviceorientationabsolute", handlerAbsolute, true);
            // 1.5秒后如果没有绝对方向数据，则回退到通用传感器
            fallbackTimer = setTimeout(registerFallback, 1500);
        }

        // 页面加载后自动运行
        window.addEventListener("DOMContentLoaded", () => {
            initCompass();
        });

        // 如果部分浏览器需要交互才解锁传感器，添加一个静默监听触发
        document.body.addEventListener('touchstart', () => {
            if (!hasHeading) initCompass();
        }, { once: true });

    </script>
</body>
</html>
