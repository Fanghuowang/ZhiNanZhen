<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>在线指南针 - 中文方向与角度</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }
        .compass-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }
        .compass {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #f0f4fa;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            margin: 1.5rem auto;
            transition: transform 0.05s ease;
        }
        .compass .circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e8f0);
            border: 4px solid #2c6cb0;
        }
        /* 方向字符 */
        .dir-label {
            position: absolute;
            font-size: 1.4rem;
            font-weight: 700;
            color: #1f3a5f;
            width: 2.2rem;
            text-align: center;
            user-select: none;
            pointer-events: none;
            z-index: 5;
        }
        .dir-n { top: 8px; left: 50%; transform: translateX(-50%); color: #c0392b; }
        .dir-e { right: 12px; top: 50%; transform: translateY(-50%); color: #2c6cb0; }
        .dir-s { bottom: 8px; left: 50%; transform: translateX(-50%); color: #27ae60; }
        .dir-w { left: 12px; top: 50%; transform: translateY(-50%); color: #e67e22; }

        /* 指针 */
        .needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 46%;
            background: linear-gradient(to bottom, #e74c3c 50%, #fff 50%);
            border-radius: 4px;
            transform-origin: center bottom;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 0.08s linear;
            z-index: 10;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
        .needle::after {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 14px solid #e74c3c;
        }

        /* 中心圆点 */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #2c3e50;
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        /* 读取卡片 */
        .readings {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 0.5rem;
        }
        .reading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }
        .reading .label {
            font-size: 1rem;
            color: #666;
            font-weight: 600;
        }
        .reading .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1f5fb4;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }
        .reading .value .dir-char {
            color: #c0392b;
            margin-right: 6px;
            font-size: 2rem;
        }

        .note {
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            margin-top: 1.2rem;
            max-width: 400px;
        }
        .note strong { color: #2c6cb0; }
        .error-msg {
            color: #c0392b;
            background: #fdecea;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="compass-container">
    <!-- 指南针主体 -->
    <div class="compass" id="compass">
        <div class="circle"></div>
        <!-- 东南西北 中文方向标记 -->
        <div class="dir-label dir-n">北</div>
        <div class="dir-label dir-e">东</div>
        <div class="dir-label dir-s">南</div>
        <div class="dir-label dir-w">西</div>
        <!-- 指针 -->
        <div class="needle" id="needle"></div>
        <div class="center-dot"></div>
    </div>

    <!-- 输出：方向与角度 -->
    <div class="readings">
        <div class="reading">
            <span class="label">当前方向</span>
            <span class="value" id="directionDisplay">
                <span class="dir-char" id="dirChar">北</span>
                <span id="angleValue">0.0°</span>
            </span>
        </div>
        <div class="reading" style="background:#f8fafc;">
            <span class="label">角度（0° = 正北，顺时针）</span>
            <span class="value" id="angleOnly" style="font-size:1.5rem;color:#2c3e50;">0.0°</span>
        </div>
    </div>

    <div class="note">
        <strong>提示：</strong> 请将设备水平放置。若方向不变，请尝试在手机上打开此页面，或点击下方按钮启动传感器。
    </div>

    <button id="startBtn" style="margin-top:16px; padding:10px 28px; background:#5498e5; color:#fff; border:none; border-radius:24px; font-size:1rem; font-weight:600; cursor:pointer;">启动指南针</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    (function() {
        // --- DOM 引用 ---
        const needleEl = document.getElementById('needle');
        const compassEl = document.getElementById('compass');
        const dirCharEl = document.getElementById('dirChar');
        const angleValueEl = document.getElementById('angleValue');
        const angleOnlyEl = document.getElementById('angleOnly');
        const startBtn = document.getElementById('startBtn');
        const errorMsg = document.getElementById('errorMsg');

        // --- 状态 ---
        let currentHeading = 0;          // 0..360 度，0 = 北，顺时针
        let isTracking = false;
        let hasHeading = false;
        let startBtnClicked = false;
        let fallbackTimer = null;
        let useAbsolute = true;

        // --- 中文方向映射（8 方位）---
        function getChineseDirection(deg) {
            // 将角度规范到 [0, 360)
            const d = ((deg % 360) + 360) % 360;
            if (d >= 337.5 || d < 22.5) return '北';
            if (d >= 22.5 && d < 67.5) return '东北';
            if (d >= 67.5 && d < 112.5) return '东';
            if (d >= 112.5 && d < 157.5) return '东南';
            if (d >= 157.5 && d < 202.5) return '南';
            if (d >= 202.5 && d < 247.5) return '西南';
            if (d >= 247.5 && d < 292.5) return '西';
            if (d >= 292.5 && d < 337.5) return '西北';
            return '北';
        }

        // --- 更新 UI ---
        function updateDisplay(heading) {
            // 规范角度
            const h = ((heading % 360) + 360) % 360;
            currentHeading = h;

            // 旋转指针（指向当前方向）
            // 指针默认指向正上方（北），rotate 角度即为 heading
            if (needleEl) {
                needleEl.style.transform = `translate(-50%, -100%) rotate(${h}deg)`;
            }

            // 中文方向
            const dir = getChineseDirection(h);
            if (dirCharEl) dirCharEl.textContent = dir;

            // 角度格式化：保留1位小数
            const angleStr = h.toFixed(1) + '°';
            if (angleValueEl) angleValueEl.textContent = angleStr;
            if (angleOnlyEl) angleOnlyEl.textContent = angleStr;
        }

        // --- 处理方向事件（通用）---
        function handleOrientation(e) {
            if (!isTracking) return;

            let heading = null;

            // 优先使用 webkitCompassHeading（iOS）
            if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
                heading = e.webkitCompassHeading;
            }
            // 否则使用 alpha（Android/Chrome）
            else if (typeof e.alpha === 'number' && !isNaN(e.alpha)) {
                // alpha: 0 表示设备指向北，顺时针增加？需要校准
                // 标准: alpha 是设备绕 z 轴的旋转，0 表示北，但方向可能相反
                // 通常设备orientation alpha: 0 指向北，但旋转方向是逆时针？
                // 实际测试中，Chrome Android 的 alpha 需要转换: heading = 360 - alpha
                // 但为了兼容，使用 (360 - alpha) % 360
                heading = (360 - e.alpha) % 360;
            }

            if (heading !== null) {
                hasHeading = true;
                updateDisplay(heading);
            }
        }

        // --- 启动指南针（需用户手势）---
        function startCompass() {
            if (isTracking) return;

            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            // 检测是否为 iOS
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            // 如果支持 requestPermission（iOS 13+）
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            isTracking = true;
                            startBtn.style.display = 'none';
                            // 监听方向事件
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            // 同时尝试绝对方向（如果支持）
                            if (window.DeviceOrientationAbsoluteEvent) {
                                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                            }
                            // 如果 3 秒内没有收到数据，提示
                            setTimeout(() => {
                                if (!hasHeading) {
                                    errorMsg.textContent = '未检测到方向数据。请确保设备有磁力计，并尝试在手机上使用。';
                                    errorMsg.style.display = 'block';
                                }
                            }, 3000);
                        } else {
                            errorMsg.textContent = '权限被拒绝。请允许访问运动与方向数据。';
                            errorMsg.style.display = 'block';
                        }
                    })
                    .catch(err => {
                        console.error('请求权限失败:', err);
                        errorMsg.textContent = '无法请求方向权限。请确保在 HTTPS 页面或 localhost 上使用。';
                        errorMsg.style.display = 'block';
                    });
            } else {
                // 非 iOS 或旧版 iOS：直接监听
                isTracking = true;
                startBtn.style.display = 'none';

                // 优先监听绝对方向
                if (window.DeviceOrientationAbsoluteEvent) {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    // 如果 1.5 秒内没有绝对方向事件，则回退到普通方向事件
                    fallbackTimer = setTimeout(() => {
                        if (!hasHeading) {
                            window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    }, 1500);
                } else {
                    // 直接监听普通方向事件
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }

                // 备用：如果长时间无数据，提示
                setTimeout(() => {
                    if (!hasHeading) {
                        errorMsg.textContent = '未检测到方向数据。请确保设备有磁力计，并尝试在手机上使用。';
                        errorMsg.style.display = 'block';
                    }
                }, 3000);
            }
        }

        // --- 初始化 ---
        function init() {
            // 初始显示北 0°
            updateDisplay(0);

            // 按钮点击启动
            startBtn.addEventListener('click', function(e) {
                e.preventDefault();
                startCompass();
            });

            // 页面加载后，如果是 Android 且支持绝对方向，可以自动启动？但为了兼容 iOS 的手势要求，统一通过按钮启动。
            // 但用户可能希望自动启动，我们可以在非 iOS 上尝试自动启动，但需要避免权限问题。
            // 为了简单，我们保持按钮启动，但为了体验，可以在非 iOS 上尝试自动监听（不请求权限）。
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (!isIOS) {
                // 非 iOS 可以直接启动，但为了避免无用户手势导致的部分浏览器限制，我们仍然通过按钮点击。
                // 为了更好的体验，可以自动启动，但需要确保用户已交互。我们可以延迟启动，但这里保持按钮。
                // 如果希望自动启动，可以取消注释下面代码，但注意部分浏览器需要用户手势。
                // startCompass(); // 但这样可能导致权限请求被忽略，所以不自动启动。
            } else {
                // iOS 显示按钮
                startBtn.style.display = 'block';
            }

            // 如果浏览器支持 DeviceOrientationEvent 并且是 Android，我们可以隐藏按钮，自动启动？
            // 为了简单，保留按钮，用户点击后启动。
            // 但为了在桌面上测试，我们也可以模拟显示角度？不，这里只处理真实设备。
            // 如果用户没有磁力计，会显示错误信息。
        }

        // 启动
        init();
    })();
</script>

</body>
</html>
