<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>东南西北 · 罗盘</title>
  <style>
    :root {
      --bg: #000000;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --dial-bg: #1c1c1e;
      --north-color: #ff3b30;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .compass-container {
      position: relative;
      width: min(85vw, 85vh, 380px);
      height: min(85vw, 85vh, 380px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .dial-wrapper {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      /* The browser handles the rotation natively */
    }

    .dial-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--dial-bg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .compass-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: visible;
    }

    .needle-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 100px;
      margin-left: -2px;
      margin-top: -100px;
      background: linear-gradient(to top, transparent 0%, var(--north-color) 100%);
      border-radius: 4px 4px 0 0;
      transform-origin: bottom center;
      z-index: 10;
    }

    .needle-tail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 70px;
      margin-left: -2px;
      background: linear-gradient(to bottom, transparent 0%, #5c5c5e 100%);
      border-radius: 0 0 4px 4px;
      transform-origin: top center;
      z-index: 10;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 20;
    }

    .info-panel {
      text-align: center;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
    }

    .heading-text {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .direction-text {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .permission-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 40px;
      text-align: center;
      transition: opacity 0.3s;
    }
    
    .permission-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .btn-primary {
      background: #0a84ff;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="permission-overlay" id="permOverlay">
    <h2>Compass Access</h2>
    <p>This app requires access to your device's compass to provide accurate headings.</p>
    <button class="btn-primary" id="grantBtn">Enable Sensors</button>
  </div>

  <div class="compass-container">
    <div class="dial-wrapper" id="dialWrapper">
      <div class="dial-bg"></div>
      <svg class="compass-svg" viewBox="0 0 400 400" id="compassSvg"></svg>
    </div>

    <div class="needle-container" id="needleContainer">
      <div class="needle"></div>
      <div class="needle-tail"></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <div class="info-panel">
    <div class="heading-text" id="headingText">0°</div>
    <div class="direction-text" id="directionText">北</div>
    
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Altitude</span>
        <span class="meta-value" id="altValue">-- m</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Speed</span>
        <span class="meta-value" id="speedValue">0 km/h</span>
      </div>
    </div>
  </div>

  <script>
    const dialWrapper = document.getElementById('dialWrapper');
    const needleContainer = document.getElementById('needleContainer');
    const headingText = document.getElementById('headingText');
    const directionText = document.getElementById('directionText');
    const permOverlay = document.getElementById('permOverlay');
    const grantBtn = document.getElementById('grantBtn');
    const compassSvg = document.getElementById('compassSvg');

    let isTracking = false;
    let currentHeading = 0;

    // Build the SVG (Replaced N/E/S/W with 北/东/南/西)
    function buildCompass() {
      let html = '';
      const cx = 200;
      const cy = 200;

      for (let i = 0; i < 360; i += 2) {
        const isMajor = i % 30 === 0;
        const isMedium = i % 10 === 0;
        const rad = (i - 90) * (Math.PI / 180);
        
        const outerR = 180;
        const innerR = isMajor ? 160 : (isMedium ? 168 : 175);
        
        const x1 = cx + outerR * Math.cos(rad);
        const y1 = cy + outerR * Math.sin(rad);
        const x2 = cx + innerR * Math.cos(rad);
        const y2 = cy + innerR * Math.sin(rad);
        
        const strokeW = isMajor ? 4 : (isMedium ? 2 : 1);
        const strokeC = isMajor ? '#ffffff' : (isMedium ? '#a0a0a5' : '#5c5c5e');
        
        html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeC}" stroke-width="${strokeW}" stroke-linecap="round" />`;

        if (isMajor && i !== 0 && i !== 90 && i !== 180 && i !== 270) {
          const textR = 140;
          const tx = cx + textR * Math.cos(rad);
          const ty = cy + textR * Math.sin(rad);
          html += `<text x="${tx}" y="${ty}" fill="#8e8e93" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i} ${tx} ${ty})">${i}°</text>`;
        }
      }

      const cardinals = [
        { label: '北', angle: 0, color: '#ff3b30' },
        { label: '东', angle: 90, color: '#ffffff' },
        { label: '南', angle: 180, color: '#ffffff' },
        { label: '西', angle: 270, color: '#ffffff' }
      ];

      cardinals.forEach(c => {
        const rad = (c.angle - 90) * (Math.PI / 180);
        const textR = 135;
        const tx = cx + textR * Math.cos(rad);
        const ty = cy + textR * Math.sin(rad);
        html += `<text x="${tx}" y="${ty}" fill="${c.color}" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="central" transform="rotate(${c.angle} ${tx} ${ty}) translate(0, 0) rotate(${-c.angle} ${tx} ${ty})">${c.label}</text>`;
      });

      compassSvg.innerHTML = html;
    }

    const dirNames = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];

    // EXACT ROTATE FUNCTION FROM YOUR REFERENCE SITE
    function rotate(degree) {
      // No requestAnimationFrame, no lerping. Just native CSS rotation.
      dialWrapper.style.transform = `rotate(${degree}deg)`;
      needleContainer.style.transform = `rotate(${-degree}deg)`;

      // Normalize for UI text
      let displayDeg = Math.round(degree) % 360;
      if (displayDeg < 0) displayDeg += 360;
      
      headingText.textContent = `${displayDeg}°`;
      
      const dirIdx = Math.round(displayDeg / 45) % 8;
      directionText.textContent = dirNames[dirIdx];
      
      if (dirIdx === 0) {
        directionText.style.color = 'var(--north-color)';
      } else {
        directionText.style.color = 'var(--text-secondary)';
      }
    }

    // EXACT SENSOR LOGIC FROM YOUR REFERENCE SITE
    function manageCompass(e) {
      let absoluteHeading = 0;

      if (e.webkitCompassHeading) {
        absoluteHeading = e.webkitCompassHeading - 180;
      } else if (e.alpha !== null && e.alpha !== undefined) {
        absoluteHeading = 180 + e.alpha;
      } else {
        return;
      }

      absoluteHeading -= 180;
      if (absoluteHeading > 360) absoluteHeading -= 360;

      // They don't smooth, they just pass it to rotate
      rotate(absoluteHeading);

      if (!isTracking) {
        isTracking = true;
        permOverlay.classList.add('hidden');
      }
    }

    function initSensors() {
      // EXACT PLATFORM DETECTION FROM REFERENCE SITE
      const isiOS = ["iPad Simulator","iPhone Simulator","iPod Simulator","iPad","iPhone","iPod"].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
      
      if (isiOS) {
        window.addEventListener("deviceorientation", manageCompass);
      } else {
        window.addEventListener("deviceorientationabsolute", manageCompass, true);
        window.addEventListener("deviceorientation", manageCompass, true);
      }
    }

    grantBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              initSensors();
              permOverlay.classList.add('hidden');
            }
          })
          .catch(console.error);
      } else {
        initSensors();
        permOverlay.classList.add('hidden');
      }
    });

    // Auto-start for Android
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      initSensors();
      permOverlay.classList.add('hidden');
    }

    buildCompass();
  </script>
</body>
</html>
