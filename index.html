<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>东南西北 · 罗盘</title>
  <style>
    :root {
      --bg: #000000;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --dial-bg: #1c1c1e;
      --north-color: #ff3b30;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      right: 24px;
      z-index: 100;
    }

    .unit-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Compass Container */
    .compass-container {
      position: relative;
      width: min(85vw, 85vh, 380px);
      height: min(85vw, 85vh, 380px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .dial-wrapper {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transition: transform 0.1s linear;
      will-change: transform;
    }

    .dial-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--dial-bg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* SVG Ticks */
    .ticks-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: visible;
    }

    /* Cardinal Characters (东南西北) */
    .cardinal-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .cardinal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.6rem;
      transform-origin: 0 145px; /* Radius mapping */
    }
    
    /* Rotate outward, then un-rotate the text to keep it upright */
    .cardinal.n { transform: rotate(0deg); color: var(--north-color); }
    .cardinal.e { transform: rotate(90deg); color: var(--text-primary); }
    .cardinal.s { transform: rotate(180deg); color: var(--text-primary); }
    .cardinal.w { transform: rotate(270deg); color: var(--text-primary); }

    .cardinal span {
      display: block;
      transform: rotate(calc(-1 * var(--angle)));
    }

    /* Center Needle */
    .needle-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.1s linear;
      will-change: transform;
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 90px;
      margin-left: -2px;
      margin-top: -90px;
      background: linear-gradient(to top, transparent 0%, var(--north-color) 100%);
      border-radius: 4px 4px 0 0;
      transform-origin: bottom center;
      z-index: 10;
    }

    .needle-tail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 70px;
      margin-left: -2px;
      background: linear-gradient(to bottom, transparent 0%, #5c5c5e 100%);
      border-radius: 0 0 4px 4px;
      transform-origin: top center;
      z-index: 10;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 20;
    }

    /* Bottom Info */
    .info-panel {
      text-align: center;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
    }

    .heading-text {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .direction-text {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Permission Overlay */
    .permission-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 40px;
      text-align: center;
      transition: opacity 0.3s;
    }
    
    .permission-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .permission-overlay h2 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    
    .permission-overlay p {
      color: var(--text-secondary);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .btn-primary {
      background: #0a84ff;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="unit-toggle" id="unitToggle">Metric</button>
  </div>

  <div class="permission-overlay" id="permOverlay">
    <h2>Compass Access</h2>
    <p>This app requires access to your device's compass and location to provide accurate headings and coordinates.</p>
    <button class="btn-primary" id="grantBtn">Enable Sensors</button>
  </div>

  <div class="compass-container" id="compassContainer">
    <div class="dial-wrapper" id="dialWrapper">
      <div class="dial-bg"></div>
      <svg class="ticks-svg" viewBox="0 0 200 200" id="ticksSvg"></svg>
      
      <div class="cardinal-container">
        <div class="cardinal n"><span style="--angle: 0deg">北</span></div>
        <div class="cardinal e"><span style="--angle: 90deg">东</span></div>
        <div class="cardinal s"><span style="--angle: 180deg">南</span></div>
        <div class="cardinal w"><span style="--angle: 270deg">西</span></div>
      </div>
    </div>

    <div class="needle-container" id="needleContainer">
      <div class="needle"></div>
      <div class="needle-tail"></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <div class="info-panel" id="infoPanel">
    <div class="heading-text" id="headingText">0°</div>
    <div class="direction-text" id="directionText">北</div>
    
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Altitude</span>
        <span class="meta-value" id="altValue">-- m</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Speed</span>
        <span class="meta-value" id="speedValue">0 km/h</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    const dialWrapper = document.getElementById('dialWrapper');
    const needleContainer = document.getElementById('needleContainer');
    const headingText = document.getElementById('headingText');
    const directionText = document.getElementById('directionText');
    const altValue = document.getElementById('altValue');
    const speedValue = document.getElementById('speedValue');
    const unitToggle = document.getElementById('unitToggle');
    const permOverlay = document.getElementById('permOverlay');
    const grantBtn = document.getElementById('grantBtn');
    const toast = document.getElementById('toast');
    const ticksSvg = document.getElementById('ticksSvg');

    let currentHeading = 0;
    let targetHeading = 0;
    let isMetric = true;
    let currentAltitude = 0;
    let currentSpeed = 0;
    let currentLat = 0;
    let currentLon = 0;
    let accuracyLevel = 'Unknown';
    let isTracking = false;

    // 1. Generate SVG Ticks (Exactly like the reference site, but cleaner)
    function generateTicks() {
      let html = '';
      for (let i = 0; i < 360; i += 2) {
        const isMajor = i % 30 === 0;
        const isMedium = i % 10 === 0;
        
        const angle = (i - 90) * (Math.PI / 180);
        const outerRadius = 90;
        const innerRadius = isMajor ? 80 : (isMedium ? 85 : 88);
        
        const x1 = 100 + outerRadius * Math.cos(angle);
        const y1 = 100 + outerRadius * Math.sin(angle);
        const x2 = 100 + innerRadius * Math.cos(angle);
        const y2 = 100 + innerRadius * Math.sin(angle);
        
        const strokeWidth = isMajor ? 2.5 : (isMedium ? 1.5 : 0.8);
        const strokeColor = isMajor ? '#ffffff' : (isMedium ? '#a0a0a5' : '#5c5c5e');
        
        html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;
      }
      
      // Add degree numbers correctly rotated
      [30, 60, 120, 150, 210, 240, 300, 330].forEach(deg => {
        const rad = (deg - 90) * (Math.PI / 180);
        const x = 100 + 70 * Math.cos(rad);
        const y = 100 + 70 * Math.sin(rad);
        
        html += `
          <text x="${x}" y="${y}" fill="#8e8e93" font-size="7" font-weight="500" text-anchor="middle" dominant-baseline="middle" 
                transform="rotate(${deg} ${x} ${y}) translate(0, 0) rotate(${-deg} ${x} ${y})">
            ${deg}°
          </text>
        `;
      });

      ticksSvg.innerHTML = html;
    }

    const directions = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
    const directionsEn = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

    // 2. Smooth Animation Loop
    let lastRenderTime = performance.now();
    function render(now) {
      const dt = now - lastRenderTime;
      lastRenderTime = now;

      if (isTracking) {
        let diff = targetHeading - currentHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        
        // Smooth lerp
        currentHeading += diff * 0.1;
        currentHeading = (currentHeading + 360) % 360;
        
        dialWrapper.style.transform = `rotate(${-currentHeading}deg)`;
        needleContainer.style.transform = `rotate(${currentHeading}deg)`;

        const displayDeg = Math.round(currentHeading);
        headingText.textContent = `${displayDeg}°`;
        
        const dirIdx = Math.round(displayDeg / 45) % 8;
        directionText.textContent = `${directions[dirIdx]}`;
        
        if (dirIdx === 0) {
          directionText.style.color = 'var(--north-color)';
        } else {
          directionText.style.color = 'var(--text-secondary)';
        }
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // 3. Sensor Handling (Using the exact logic from your reference site)
    function manageCompass(e) {
      let heading = 0;
      
      // Logic from your source: iOS uses webkitCompassHeading, Android uses alpha
      if (e.webkitCompassHeading) {
        // iOS: webkitCompassHeading is 0 when facing North.
        heading = e.webkitCompassHeading;
      } else if (e.absolute && e.alpha !== null) {
        // Android / Chrome absolute orientation: alpha is 0 when facing North (sometimes needs inversion)
        heading = 360 - e.alpha;
      } else if (e.alpha !== null) {
        // Fallback for relative sensors
        heading = 360 - e.alpha;
      } else {
        return; // No data
      }

      // Update the target
      targetHeading = (heading + 360) % 360;

      if (!isTracking) {
        isTracking = true;
        currentHeading = targetHeading; // Snap to initial position
        permOverlay.classList.add('hidden');
      }
    }

    // 4. GPS Handling
    function handleLocation(position) {
      const { latitude, longitude, altitude, speed, accuracy } = position.coords;
      currentLat = latitude;
      currentLon = longitude;
      
      if (accuracy < 20) accuracyLevel = 'High';
      else if (accuracy < 50) accuracyLevel = 'Medium';
      else accuracyLevel = 'Low';

      currentSpeed = speed || 0;
      updateSpeedDisplay();

      if (altitude !== null && altitude !== undefined) {
        currentAltitude = altitude;
        updateAltitudeDisplay();
      }
    }

    function handleLocationError(err) {
      console.warn('Geolocation error:', err);
    }

    function updateSpeedDisplay() {
      if (isMetric) {
        speedValue.textContent = `${(currentSpeed * 3.6).toFixed(1)} km/h`;
      } else {
        speedValue.textContent = `${(currentSpeed * 2.237).toFixed(1)} mph`;
      }
    }

    function updateAltitudeDisplay() {
      if (isMetric) {
        altValue.textContent = `${currentAltitude.toFixed(0)} m`;
      } else {
        altValue.textContent = `${(currentAltitude * 3.281).toFixed(0)} ft`;
      }
    }

    // 5. Interactions
    unitToggle.addEventListener('click', () => {
      isMetric = !isMetric;
      unitToggle.textContent = isMetric ? 'Metric' : 'Imperial';
      updateSpeedDisplay();
      if (currentAltitude !== null) updateAltitudeDisplay();
    });

    let pressTimer;
    const infoPanel = document.getElementById('infoPanel');

    function startPress() {
      pressTimer = setTimeout(() => {
        const coordsText = `Lat: ${currentLat.toFixed(6)}, Lon: ${currentLon.toFixed(6)}\nHeading: ${Math.round(currentHeading)}° (Confidence: ${accuracyLevel})`;
        navigator.clipboard.writeText(coordsText).then(() => {
          showToast('Coordinates & Heading Copied!');
        }).catch(() => {
          showToast('Failed to copy');
        });
      }, 600);
    }

    function cancelPress() {
      clearTimeout(pressTimer);
    }

    infoPanel.addEventListener('mousedown', startPress);
    infoPanel.addEventListener('touchstart', startPress);
    infoPanel.addEventListener('mouseup', cancelPress);
    infoPanel.addEventListener('touchend', cancelPress);
    infoPanel.addEventListener('mouseleave', cancelPress);
    infoPanel.addEventListener('touchcancel', cancelPress);

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 6. Initialization
    function initSensors() {
      // Exact event listeners from your reference file
      if (["iPad Simulator","iPhone Simulator","iPod Simulator","iPad","iPhone","iPod"].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document)) {
        window.addEventListener("deviceorientation", manageCompass, true);
      } else {
        window.addEventListener("deviceorientationabsolute", manageCompass, true);
        // Fallback for some Android devices that only fire deviceorientation
        window.addEventListener("deviceorientation", manageCompass, true);
      }

      // GPS
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(handleLocation, handleLocationError, {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 5000
        });
      }
    }

    grantBtn.addEventListener('click', () => {
      // Request permission for iOS 13+
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              initSensors();
              permOverlay.classList.add('hidden');
            }
          })
          .catch(console.error);
      } else {
        initSensors();
        permOverlay.classList.add('hidden');
      }
    });

    // Generate visuals on load
    generateTicks();
    
    // Auto-start on Android (browsers that don't need explicit permission)
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      initSensors();
      permOverlay.classList.add('hidden');
    }

  </script>
</body>
</html>
