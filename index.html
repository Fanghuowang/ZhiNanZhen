<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>在线指南针 - 磁航向</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --main-color: #5498e5;
            --accent-color: #d62828; /* Red pointer */
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .compass-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 20px auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* The static red pointer at the top */
        .arrow {
            position: absolute;
            width: 0;
            height: 0;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-style: solid;
            border-width: 30px 15px 0 15px;
            border-color: var(--accent-color) transparent transparent transparent;
            z-index: 10;
        }

        /* The rotating dial */
        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: transform 0.1s linear;
            background: #fafafa;
            border: 4px solid #333;
        }

        /* SVG Styles for the dial */
        .compass-dial svg {
            width: 100%;
            height: 100%;
        }

        .tick {
            stroke: #333;
            stroke-width: 1.5;
        }

        .tick-major {
            stroke: #000;
            stroke-width: 2.5;
        }

        .text-num {
            font-size: 14px;
            fill: #333;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .text-dir {
            font-size: 22px;
            fill: #111;
            font-weight: 900;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* Center pin */
        .center-pin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ccc;
            border: 3px solid #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        /* Readings */
        .direction-readings {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        .reading {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .reading-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }

        .reading-value {
            font-size: 2rem;
            font-weight: 800;
            color: #111;
            font-variant-numeric: tabular-nums;
            min-width: 140px;
            text-align: right;
        }

        .sensor-hint {
            margin-top: 15px;
            color: #d62828;
            font-weight: bold;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="compass-container">
        <!-- Fixed red pointer -->
        <div class="arrow"></div>
        
        <!-- Rotating compass dial -->
        <div class="compass-dial" id="compassDial">
            <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Ring -->
                <circle cx="250" cy="250" r="230" fill="none" stroke="#333" stroke-width="8"/>
                <circle cx="250" cy="250" r="210" fill="none" stroke="#ccc" stroke-width="1"/>

                <!-- Ticks -->
                <g id="ticks">
                    <!-- We generate ticks via JS or hardcode here. Hardcoding for simplicity. -->
                    <!-- Major Ticks (Every 30 degrees) -->
                    <g transform="translate(250, 250)">
                        <!-- 0 (North) -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(0)"/>
                        <!-- 30 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(30)"/>
                        <!-- 60 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(60)"/>
                        <!-- 90 (East) -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(90)"/>
                        <!-- 120 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(120)"/>
                        <!-- 150 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(150)"/>
                        <!-- 180 (South) -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(180)"/>
                        <!-- 210 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(210)"/>
                        <!-- 240 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(240)"/>
                        <!-- 270 (West) -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(270)"/>
                        <!-- 300 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(300)"/>
                        <!-- 330 -->
                        <line x1="0" y1="-230" x2="0" y2="-200" class="tick-major" transform="rotate(330)"/>
                    </g>
                </g>

                <!-- Numbers -->
                <g transform="translate(250, 250)">
                    <text y="-165" class="text-num" transform="rotate(0)">0</text>
                    <text y="-165" class="text-num" transform="rotate(30)">30</text>
                    <text y="-165" class="text-num" transform="rotate(60)">60</text>
                    <text y="-165" class="text-num" transform="rotate(90)">90</text>
                    <text y="-165" class="text-num" transform="rotate(120)">120</text>
                    <text y="-165" class="text-num" transform="rotate(150)">150</text>
                    <text y="-165" class="text-num" transform="rotate(180)">180</text>
                    <text y="-165" class="text-num" transform="rotate(210)">210</text>
                    <text y="-165" class="text-num" transform="rotate(240)">240</text>
                    <text y="-165" class="text-num" transform="rotate(270)">270</text>
                    <text y="-165" class="text-num" transform="rotate(300)">300</text>
                    <text y="-165" class="text-num" transform="rotate(330)">330</text>
                </g>

                <!-- Cardinal Directions (东南西北) -->
                <g transform="translate(250, 250)">
                    <text y="-100" class="text-dir" transform="rotate(0)">北</text>
                    <text y="-100" class="text-dir" transform="rotate(90)">东</text>
                    <text y="-100" class="text-dir" transform="rotate(180)">南</text>
                    <text y="-100" class="text-dir" transform="rotate(270)">西</text>
                </g>
            </svg>
        </div>
        
        <div class="center-pin"></div>
    </div>

    <div class="direction-readings">
        <div class="reading reading-magnetic">
            <span class="reading-label">磁航向</span>
            <span class="reading-value" id="magneticValue">等待传感器...</span>
        </div>
    </div>

    <p class="sensor-hint" id="sensorHint">未检测到指南针传感器。请改用手机。</p>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const compassDial = document.getElementById("compassDial");
            const magneticValue = document.getElementById("magneticValue");
            const sensorHint = document.getElementById("sensorHint");

            let latestCompass = 0;
            let hasHeading = false;
            let pendingFrame = false;

            // Returns the Chinese direction based on the heading
            function getDirection(compass) {
                if (compass >= 0 && compass < 22.5) return "北";
                if (compass >= 22.5 && compass < 67.5) return "东北";
                if (compass >= 67.5 && compass < 112.5) return "东";
                if (compass >= 112.5 && compass < 157.5) return "东南";
                if (compass >= 157.5 && compass < 202.5) return "南";
                if (compass >= 202.5 && compass < 247.5) return "西南";
                if (compass >= 247.5 && compass < 292.5) return "西";
                if (compass >= 292.5 && compass < 337.5) return "西北";
                return "北";
            }

            // Formats heading to "Direction 55.0°"
            function formatHeading(value) {
                const clamped = (value % 360 + 360) % 360;
                return `${getDirection(clamped)} ${clamped.toFixed(1)}°`;
            }

            // Main rendering loop
            function onCompassFrame() {
                if (!hasHeading) return;

                // Rotate the dial
                if (compassDial) {
                    compassDial.style.transform = `translate(-50%, -50%) rotate(${-latestCompass}deg)`;
                }

                // Update text
                if (magneticValue) {
                    magneticValue.textContent = formatHeading(latestCompass);
                }
            }

            function applyHeading(heading) {
                latestCompass = heading;
                hasHeading = true;

                if (pendingFrame) return;
                pendingFrame = true;
                requestAnimationFrame(() => {
                    pendingFrame = false;
                    onCompassFrame();
                });
            }

            // --- Sensor Handling Logic ---

            const isIOS = navigator.userAgent.match(/(iPod|iPhone|iPad)/) && navigator.userAgent.match(/AppleWebKit/);
            const isHandheld = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));

            let fallbackTimer = null;

            function handlerAbsolute(e) {
                if (typeof e.alpha !== "number") return;
                if (fallbackTimer !== null) {
                    clearTimeout(fallbackTimer);
                    fallbackTimer = null;
                }
                window.removeEventListener("deviceorientation", handlerFallback, true);
                // Absolute alpha is 0-360 counterclockwise, convert to compass heading
                applyHeading(Math.abs(e.alpha - 360));
            }

            function handlerFallback(e) {
                if (typeof e.webkitCompassHeading === "number") {
                    applyHeading(e.webkitCompassHeading);
                    return;
                }
                if (typeof e.alpha !== "number") return;
                applyHeading(Math.abs(e.alpha - 360));
            }

            function registerFallback() {
                fallbackTimer = null;
                window.addEventListener("deviceorientation", handlerFallback, true);
            }

            function init() {
                if (isIOS) {
                    // iOS requires user gesture, but since we removed the button,
                    // we can try to request it on first tap anywhere on screen.
                    const startCompassOnTap = () => {
                        if (typeof DeviceOrientationEvent.requestPermission === "function") {
                            DeviceOrientationEvent.requestPermission()
                                .then((response) => {
                                    if (response === "granted") {
                                        window.addEventListener("deviceorientation", handlerFallback, true);
                                        document.removeEventListener("click", startCompassOnTap);
                                    } else {
                                        alert("要使用此功能，必须授予传感器权限。");
                                    }
                                })
                                .catch(() => {
                                    alert("您的设备不支持所需的权限。");
                                });
                        } else {
                            window.addEventListener("deviceorientation", handlerFallback, true);
                            document.removeEventListener("click", startCompassOnTap);
                        }
                    };
                    document.addEventListener("click", startCompassOnTap);
                    magneticValue.textContent = "点击屏幕启动指南针";
                } else {
                    window.addEventListener("deviceorientationabsolute", handlerAbsolute, true);
                    fallbackTimer = setTimeout(registerFallback, 1500);
                    
                    // Set a timeout to show hint if no sensor data arrives
                    setTimeout(() => {
                        if (!hasHeading && !isHandheld) {
                            sensorHint.style.display = "block";
                        }
                    }, 3000);
                }
            }

            init();
        });
    </script>
</body>
</html>
