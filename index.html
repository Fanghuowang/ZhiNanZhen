<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>东南西北 · 罗盘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .compass-card {
      background: radial-gradient(circle at 30% 25%, #1e2a3a, #0a0e14);
      border-radius: 56px;
      padding: 30px 24px 24px 24px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), inset 0 1px 4px rgba(255, 255, 255, 0.08);
      border: 1px solid #2e3b4e;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .compass {
      position: relative;
      width: min(78vw, 78vh, 360px);
      height: min(78vw, 78vh, 360px);
      border-radius: 50%;
      background: #0f1621;
      box-shadow: 
        inset 0 12px 28px rgba(0, 0, 0, 0.9),
        inset 0 -6px 12px rgba(70, 130, 200, 0.15),
        0 0 0 6px #0e1219,
        0 0 0 8px #2a3648,
        0 20px 40px rgba(0, 0, 0, 0.7);
      touch-action: none;
    }

    /* 刻度环 */
    .ticks {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background-image: repeating-conic-gradient(
        from 0deg,
        #6f8fb0 0deg 1deg,
        transparent 1deg 4deg
      );
      -webkit-mask-image: radial-gradient(circle, transparent 72%, black 73%, black 97%, transparent 100%);
      mask-image: radial-gradient(circle, transparent 72%, black 73%, black 97%, transparent 100%);
      opacity: 0.4;
    }

    /* 旋转表盘 */
    .dial {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      will-change: transform;
    }

    /* 东南西北文字完美定位 */
    .dir {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transform-origin: 0 150px; /* 旋转中心点 = 0 0(自身中心) + 150px 半径 */
    }

    /* 分别设置初始位置并保持文字直立 */
    .dir-n { transform: rotate(0deg); color: #ff5e5e; text-shadow: 0 0 15px #ff0000; background: rgba(255, 0, 0, 0.1); }
    .dir-e { transform: rotate(90deg); color: #5bc0ff; text-shadow: 0 0 15px #0077ff; background: rgba(0, 120, 255, 0.1); }
    .dir-s { transform: rotate(180deg); color: #5eff9e; text-shadow: 0 0 15px #00ff55; background: rgba(0, 255, 100, 0.1); }
    .dir-w { transform: rotate(270deg); color: #ffd95b; text-shadow: 0 0 15px #ffaa00; background: rgba(255, 170, 0, 0.1); }

    /* 修正文字方向，让其始终端正 */
    .dir span {
      display: block;
      width: 100%;
      height: 100%;
      line-height: 60px;
      text-align: center;
    }
    .dir-n span { transform: rotate(0deg); }
    .dir-e span { transform: rotate(-90deg); }
    .dir-s span { transform: rotate(-180deg); }
    .dir-w span { transform: rotate(-270deg); }

    /* 指针系统 */
    .needle-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 80px;
      margin-left: -3px;
      margin-top: -80px;
      background: linear-gradient(to top, #ff5e5e 0%, #ff9f4b 100%);
      border-radius: 10px 10px 0 0;
      transform-origin: bottom center;
      box-shadow: 0 0 15px #ff4d4d;
      border: 1px solid #ffccaa;
      z-index: 20;
    }

    .needle-tail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 60px;
      margin-left: -3px;
      background: linear-gradient(to bottom, #4a6f8a 0%, #1e2f40 100%);
      border-radius: 0 0 10px 10px;
      transform-origin: top center;
      z-index: 15;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      background: #cddcec;
      border-radius: 50%;
      box-shadow: 0 0 0 6px #0b1118, 0 0 15px #aad0ff;
      z-index: 30;
    }

    /* 数据显示 */
    .bearing-display {
      margin-top: 24px;
      text-align: center;
      color: #b8d4f0;
      font-size: 1.5rem;
      font-weight: 600;
      background: #0c121c;
      padding: 10px 32px;
      border-radius: 50px;
      box-shadow: inset 0 2px 8px #000000, 0 4px 12px #00000060;
      letter-spacing: 2px;
      border: 1px solid #253544;
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 260px;
    }

    .bearing-display span:first-child {
      color: #fff;
      min-width: 3em;
      text-align: right;
    }
    .bearing-display span:last-child {
      color: #ff5e5e;
      min-width: 2em;
      text-align: left;
    }

    .hint {
      color: #5f7d9c;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 16px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div class="compass-card">
  <div class="compass" id="compass">
    <div class="ticks"></div>
    
    <!-- 表盘 -->
    <div class="dial" id="dial">
      <div class="dir dir-n"><span>北</span></div>
      <div class="dir dir-e"><span>东</span></div>
      <div class="dir dir-s"><span>南</span></div>
      <div class="dir dir-w"><span>西</span></div>
    </div>

    <!-- 指针 -->
    <div class="needle-container" id="needleContainer">
      <div class="needle"></div>
      <div class="needle-tail"></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <div class="bearing-display">
    <span id="bearingValue">0°</span>
    <span id="directionLabel">北</span>
  </div>
  <div class="hint" id="hintText">请点击屏幕授权传感器</div>
</div>

<script>
  const dial = document.getElementById('dial');
  const needleContainer = document.getElementById('needleContainer');
  const bearingValue = document.getElementById('bearingValue');
  const directionLabel = document.getElementById('directionLabel');
  const hintText = document.getElementById('hintText');

  const DIR_NAMES = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];

  let targetAlpha = 0;
  let currentAlpha = 0;
  let isActive = false;

  // 核心平滑算法：环形插值防跳变
  function updateDisplay() {
    if (!isActive) return;

    // 计算最短路径差值 (处理 359 -> 0 的环绕)
    let diff = targetAlpha - currentAlpha;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    
    // 缓动插值
    currentAlpha += diff * 0.15;
    if (currentAlpha < 0) currentAlpha += 360;
    if (currentAlpha >= 360) currentAlpha -= 360;

    // 1. 表盘旋转：跟随手机角度 (东南西北随之转动)
    dial.style.transform = `rotate(${currentAlpha}deg)`;
    
    // 2. 指针旋转：永远指向北方 (反向旋转)
    needleContainer.style.transform = `rotate(${-currentAlpha}deg)`;

    // 3. 文本显示
    const displayAlpha = Math.round(currentAlpha);
    const dirIndex = Math.round(displayAlpha / 45) % 8;
    
    bearingValue.textContent = displayAlpha + '°';
    directionLabel.textContent = DIR_NAMES[dirIndex];
    
    // 动态文字颜色
    const colors = ['#ff5e5e', '#ffaa5e', '#5bc0ff', '#5bd4ff', '#5eff9e', '#aaff5e', '#ffd95b', '#ff9e5e'];
    directionLabel.style.color = colors[dirIndex];

    requestAnimationFrame(updateDisplay);
  }

  // 处理传感器数据
  function handleOrientation(event) {
    let alpha = event.alpha;

    // 兼容 iOS 的 webkitCompassHeading (它直接提供了手机朝向，0=北，90=东)
    if (event.webkitCompassHeading !== undefined) {
      alpha = event.webkitCompassHeading;
    }

    if (alpha === null || alpha === undefined) return;

    // 标准化角度到 0-360
    targetAlpha = (alpha % 360 + 360) % 360;
    
    if (!isActive) {
      isActive = true;
      currentAlpha = targetAlpha; // 首次直接对齐，避免从0跳转
      hintText.textContent = '🧭 转动手机，指针自动指北';
      requestAnimationFrame(updateDisplay);
    }
  }

  // 权限请求逻辑
  function initCompass() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+ 需要用户交互授权
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            hintText.textContent = '🧭 罗盘已启动';
          } else {
            hintText.textContent = '⚠️ 未获得传感器权限';
          }
        })
        .catch(console.error);
    } else {
      // Android / 其他浏览器直接监听
      window.addEventListener('deviceorientation', handleOrientation, true);
      
      // 如果 2 秒内没有数据，提示可能不支持
      setTimeout(() => {
        if (!isActive) {
          hintText.textContent = '⚠️ 未检测到传感器，请确保在 HTTPS 下访问';
        }
      }, 2000);
    }
  }

  // 绑定点击启动
  window.addEventListener('click', initCompass, { once: true });
  window.addEventListener('touchstart', initCompass, { once: true });

  // 主动尝试启动（针对不需要权限的安卓）
  initCompass();
</script>
</body>
</html>
