<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>简易指南针</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 指南针主表盘 */
        .compass-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #1e293b;
            border: 4px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 旋转的刻度盘 */
        .dial {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.1s linear;
        }

        /* 方位文字 东南西北 */
        .direction {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border-radius: 50%;
            border: 2px solid #334155;
        }

        /* 北为红色突出显示 */
        .north { top: 8px; left: 50%; transform: translateX(-50%); color: #ef4444; border-color: #ef4444; }
        .east  { right: 8px; top: 50%; transform: translateY(-50%); color: #cbd5e1; }
        .south { bottom: 8px; left: 50%; transform: translateX(-50%); color: #cbd5e1; }
        .west  { left: 8px; top: 50%; transform: translateY(-50%); color: #cbd5e1; }

        /* 刻度线 */
        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #64748b;
            top: 20px;
            left: 50%;
            transform-origin: 50% 140px; /* 320/2 - 20 */
        }

        .tick.major {
            height: 14px;
            width: 3px;
            background: #94a3b8;
            top: 16px;
            transform-origin: 50% 144px;
        }

        /* 中心固定指针 (指向上方) */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 110px;
            background: linear-gradient(to bottom, #ef4444, #ef4444 40%, transparent 40%);
            transform: translate(-50%, -100%);
            z-index: 10;
            border-radius: 4px;
            pointer-events: none;
        }

        /* 中心圆点 */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* 底部角度显示 */
        .angle-display {
            margin-top: 40px;
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
            background: #1e293b;
            padding: 10px 30px;
            border-radius: 50px;
            border: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="compass-container">
        <div class="dial" id="dial">
            <div class="direction north">北</div>
            <div class="direction east">东</div>
            <div class="direction south">南</div>
            <div class="direction west">西</div>
            <!-- 刻度将通过JS生成 -->
        </div>
        <!-- 顶部固定指针 -->
        <div class="pointer"></div>
        <div class="center-dot"></div>
    </div>

    <div class="angle-display" id="angleDisplay">0°</div>

    <script>
        // 生成表盘刻度线
        const dial = document.getElementById('dial');
        for (let i = 0; i < 360; i += 15) {
            const tick = document.createElement('div');
            tick.className = 'tick' + (i % 90 === 0 ? ' major' : '');
            tick.style.transform = `translateX(-50%) rotate(${i}deg)`;
            dial.appendChild(tick);
        }

        const angleDisplay = document.getElementById('angleDisplay');
        let currentHeading = 0;
        let isActive = false;

        // 核心更新逻辑
        function updateCompass(alpha) {
            if (alpha === null || isNaN(alpha)) return;
            
            // 转换为0-360度的航向角
            let heading = (360 - alpha) % 360;
            if (heading < 0) heading += 360;
            
            currentHeading = heading;

            // 旋转表盘 (因为指针是固定的，表盘反向旋转)
            // 修正：表盘应顺时针旋转，以反映手机顶部指向的方向
            // 原逻辑：手机平放，顶部指向北(0°)，alpha约0，表盘转0°
            // 顶部指向东(90°)，alpha约270，表盘应转-90°即270°？我们这里让表盘转 -heading 度
            dial.style.transform = `rotate(${-heading}deg)`;
            
            // 更新角度数字
            angleDisplay.textContent = `${heading.toFixed(1)}°`;
            
            if (!isActive) {
                isActive = true;
            }
        }

        // 绑定方向传感器事件
        function startSensors() {
            // 优先使用绝对方向传感器 (Android Chrome 支持良好)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            let alpha = null;
            
            // 如果设备支持 webkitCompassHeading (iOS / 部分浏览器)
            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                alpha = 360 - event.webkitCompassHeading; // 转换为标准 alpha 角度
            } else if (event.alpha !== null) {
                alpha = event.alpha;
            }

            if (alpha !== null) {
                requestAnimationFrame(() => updateCompass(alpha));
            }
        }

        // 自动启动
        startSensors();

        // 部分 Android 浏览器需要用户交互才能解锁传感器，添加一个静默监听
        // 如果首次加载没有反应，用户触摸屏幕后会自动激活
        document.body.addEventListener('touchstart', () => {
            startSensors();
        }, { once: true });
        
        // 兜底：如果浏览器不允许自动启动，显示提示（但按照要求，我们不添加额外按钮）
        setTimeout(() => {
            if (!isActive) {
                // 尝试强制触发一次，或者只是等待用户触摸
                // 现代 Android Chrome 通常会自动放行
            }
        }, 1000);
    </script>
</body>
</html>
